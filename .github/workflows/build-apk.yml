name: Build DanceVault Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Compilar DanceVault APK (v1.0.2)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Preparar Android SDK y aceptar licencias
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID SDK: $SDK_ROOT"
          mkdir -p "$SDK_ROOT/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$SDK_ROOT/licenses/android-sdk-license"
          SDKMANAGER=$(command -v sdkmanager || find "$SDK_ROOT/cmdline-tools" -name sdkmanager 2>/dev/null | head -n 1 || true)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          fi

      - name: Configurar caché de Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Instalar dependencias de Node.js
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Verificar tipos TypeScript
        run: npm run lint

      - name: Compilar aplicación web y sincronizar con Android (Capacitor)
        run: npm run android:sync

      - name: Preparar permisos de Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Compilar APK instalable (Debug firmado para pruebas en móvil)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Renombrar APK con versión legible
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk DanceVault-v1.0.2-android.apk
          ls -lh DanceVault-v1.0.2-android.apk

      - name: Subir APK descargable como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DanceVault-v1.0.2-APK
          path: DanceVault-v1.0.2-android.apk
          retention-days: 30

      - name: Resumen de compilación
        run: |
          echo "### DanceVault v1.0.2 APK compilada con éxito" >> $GITHUB_STEP_SUMMARY
          echo "- **Archivo:** \`DanceVault-v1.0.2-android.apk\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Application ID:** \`com.dancevault.app\`" >> $GITHUB_STEP_SUMMARY
          echo "- Descarga el artifact **DanceVault-v1.0.2-APK** desde esta ejecución, descomprime el ZIP en tu móvil Android y ábrelo para instalar." >> $GITHUB_STEP_SUMMARY
